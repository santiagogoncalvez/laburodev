name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  # Lint con Biome desde la raíz (config única del repo: frontend + backend).
  # Corre en PRs y pushes; gate de los dos deploys via `needs`.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint

  backend-test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Seed Database
        run: npm run db:seed
        working-directory: backend
      - name: Typecheck (TypeScript)
        run: npm run typecheck
        working-directory: backend
      - name: Test (sin tests de IA)
        run: npm test -- --test-skip-pattern="AI"
        working-directory: backend

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend-smoke-test:
    needs: [backend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Dockerfile.vercel es el artefacto real que Vercel despliega (build de tsc +
      # CMD node dist/server.js, ENV NODE_ENV=production). El smoke test valida eso.
      - name: Build image (Dockerfile.vercel)
        run: docker build -f backend/Dockerfile.vercel -t laburodev-api backend
      - name: Smoke test
        run: |
          docker run -d --name api -p 3000:3000 laburodev-api
          sleep 5
          curl -f http://localhost:3000/health
      - name: Container logs (si falla)
        if: failure()
        run: docker logs api

  deploy-frontend:
    needs: [frontend-build, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
      PRODUCTION_URL: https://laburodev.vercel.app
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest
      - name: Validar token contra el proyecto
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_FRONTEND }}
        run: |
          code=$(curl -s -o /tmp/proyecto.json -w "%{http_code}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID")
          echo "GET /v9/projects/{id} → HTTP $code"
          if [ "$code" != "200" ]; then
            echo "Respuesta de Vercel:"
            cat /tmp/proyecto.json
            exit 1
          fi
          echo "Proyecto: $(jq -r .name /tmp/proyecto.json) · id $(jq -r .id /tmp/proyecto.json) · rootDirectory: $(jq -r '.rootDirectory // "(vacío)"' /tmp/proyecto.json)"
      - name: Vincular proyecto
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_FRONTEND }}
      - name: Deploy a producción
        run: vercel deploy --prod --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_FRONTEND }}
      - name: Smoke test en producción
        run: |
          curl -f --retry 3 --retry-delay 5 --retry-all-errors -sS "$PRODUCTION_URL/"
          echo ""
          echo "OK → $PRODUCTION_URL"

  preview-frontend:
    needs: [frontend-build, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    concurrency:
      group: preview-frontend
      cancel-in-progress: true
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest
      - name: Vincular proyecto (entorno preview)
        run: vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_FRONTEND }}
      - name: Deploy a preview
        run: vercel deploy --token=$VERCEL_TOKEN | tee /tmp/preview-url.txt
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_FRONTEND }}
      - name: Mostrar URL de preview
        run: echo "Preview URL => $(tail -1 /tmp/preview-url.txt)"

  preview-backend:
    needs: [backend-smoke-test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    concurrency:
      group: preview-backend
      cancel-in-progress: true
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_BACKEND }}
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest
      - name: Vincular proyecto (entorno preview)
        run: vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_BACKEND }}
      - name: Deploy a preview
        run: vercel deploy --token=$VERCEL_TOKEN | tee /tmp/preview-url.txt
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_BACKEND }}
      - name: Mostrar URL de preview
        run: echo "Preview URL => $(tail -1 /tmp/preview-url.txt)"

  deploy-backend:
    needs: [backend-smoke-test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_BACKEND }}
      PRODUCTION_URL: https://laburodev-api.santiagogoncalvez.com
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest
      - name: Validar token contra el proyecto
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_BACKEND }}
        run: |
          code=$(curl -s -o /tmp/proyecto.json -w "%{http_code}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID")
          echo "GET /v9/projects/{id} → HTTP $code"
          if [ "$code" != "200" ]; then
            echo "Respuesta de Vercel:"
            cat /tmp/proyecto.json
            exit 1
          fi
          echo "Proyecto: $(jq -r .name /tmp/proyecto.json) · id $(jq -r .id /tmp/proyecto.json) · rootDirectory: $(jq -r '.rootDirectory // "(vacío)"' /tmp/proyecto.json)"
      - name: Vincular proyecto
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_BACKEND }}
      - name: Deploy a producción
        run: vercel deploy --prod --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_BACKEND }}
      - name: Smoke test en producción
        run: |
          curl -f --retry 3 --retry-delay 5 --retry-all-errors -sS "$PRODUCTION_URL/health"
          echo ""
          echo "OK → $PRODUCTION_URL/health"
