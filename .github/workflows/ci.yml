name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install
        working-directory: backend
      - name: Seed Database
        run: npm run db:seed
        working-directory: backend
      - name: Test (sin tests de IA)
        run: node --test --test-skip-pattern="AI" --test-force-exit
        working-directory: backend

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend-smoke-test:
    needs: [backend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install
        working-directory: backend
      - name: Smoke test
        run: |
          node app.js &
          sleep 5
          curl -f http://localhost:3000/health
        working-directory: backend

  deploy-frontend:
    needs: [frontend-build]
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest
      - name: Validar token contra el proyecto
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_FRONTEND }}
        run: |
          code=$(curl -s -o /tmp/proyecto.json -w "%{http_code}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID")
          echo "GET /v9/projects/{id} → HTTP $code"
          if [ "$code" != "200" ]; then
            echo "Respuesta de Vercel:"
            cat /tmp/proyecto.json
            exit 1
          fi
          echo "Proyecto: $(jq -r .name /tmp/proyecto.json) · id $(jq -r .id /tmp/proyecto.json) · rootDirectory: $(jq -r '.rootDirectory // "(vacío)"' /tmp/proyecto.json)"
      - name: Vincular proyecto
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_FRONTEND }}
      - name: Deploy a producción
        run: vercel deploy --prod --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_FRONTEND }}

  deploy-backend:
    needs: [backend-smoke-test]
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_BACKEND }}
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest
      - name: Validar token contra el proyecto
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_BACKEND }}
        run: |
          code=$(curl -s -o /tmp/proyecto.json -w "%{http_code}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID")
          echo "GET /v9/projects/{id} → HTTP $code"
          if [ "$code" != "200" ]; then
            echo "Respuesta de Vercel:"
            cat /tmp/proyecto.json
            exit 1
          fi
          echo "Proyecto: $(jq -r .name /tmp/proyecto.json) · id $(jq -r .id /tmp/proyecto.json) · rootDirectory: $(jq -r '.rootDirectory // "(vacío)"' /tmp/proyecto.json)"
      - name: Vincular proyecto
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_BACKEND }}
      - name: Deploy a producción
        run: vercel deploy --prod --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_BACKEND }}
